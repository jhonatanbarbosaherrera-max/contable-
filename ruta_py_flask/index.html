
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
    crossorigin="anonymous">

    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="app.js"></script>

    <title>API Básica Flask</title>
</head>

<body>

    <div class="container my-5 text-center">

        <h1>PROGRAMAS CON FLASK</h1>
        <hr>

        <fieldset>

            <legend>Seleccione una opción:</legend>

            <input type="radio" id="opcion1" name="opcion"
            value="1" checked onclick="opcion1()" />
            <label for="opcion1">Mensaje</label>

            <input type="radio" id="opcion2" name="opcion"
            value="2" onclick="opcion2()" />
            <label for="opcion2">Notas</label>

            <input type="radio" id="opcion3" name="opcion"
            value="3" onclick="opcion3()" />
            <label for="opcion3">Edad</label>

            <input type="radio" id="opcion4" name="opcion"
            value="4" onclick="opcion4()" />
            <label for="opcion4">Arreglos</label>

            <input type="radio" id="opcion5" name="opcion"
            value="5" onclick="opcion5()" />
            <label for="opcion5">Ecuación</label>

            <input type="radio" id="opcion6" name="opcion"
            value="6" onclick="opcion6()" />
            <label for="opcion6">Tabla</label>

            <input type="radio" id="opcion7" name="opcion"
            value="7" onclick="opcion7()" />
            <label for="opcion7">Áreas</label>

        </fieldset>

        <div class="mt-4">

            <input type="number" id="t1"
            class="form-control mb-2" />

            <input type="number" id="t2"
            class="form-control mb-2" />

            <input type="number" id="t3"
            class="form-control mb-2" />

        </div>

        <div class="container my-5 text-center">

            <button class="btn btn-success w-25"
            onclick="enviar()">
                Enviar
            </button>

            <div class="mt-5" id="contenido"></div>

        </div>

    </div>

</body>
</html>
